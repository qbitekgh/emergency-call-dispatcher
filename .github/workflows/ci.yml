name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Reuse downloaded Maven dependencies between runs (cache key is based on pom.xml).
          cache: maven

      # Unit and integration tests. GitHub-hosted Ubuntu runners have Docker, so Testcontainers works.
      - name: Build and test
        run: ./mvnw -B verify
