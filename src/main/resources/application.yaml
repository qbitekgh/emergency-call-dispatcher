spring:
  application:
    name: emergency-call-dispatcher
  datasource:
    # Defaults match compose.yaml; override with environment variables in Docker.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatcher}
    username: ${DB_USERNAME:dispatcher}
    password: ${DB_PASSWORD:dispatcher}
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      # Each HTTP request runs on a cheap virtual thread (Java 21) instead of a pooled platform thread.
      # While a request waits for the database, its virtual thread is parked and the carrier thread serves others.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Only /actuator/health is published over HTTP (used to check that the app is up).
        include: health

dispatch:
  # Queue ordering: "priority" (higher priority first, then oldest) or "fifo" (oldest first).
  strategy: priority
