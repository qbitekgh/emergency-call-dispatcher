spring:
  application:
    name: emergency-call-dispatcher
  datasource:
    # Defaults match compose.yaml; override with environment variables in Docker / Kubernetes.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatcher}
    username: ${DB_USERNAME:dispatcher}
    password: ${DB_PASSWORD:dispatcher}
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
