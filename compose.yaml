services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dispatcher
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
