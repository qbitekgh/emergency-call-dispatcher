services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dispatcher
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      # Inside the Compose network the database is reachable by its service name, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/dispatcher
      DB_USERNAME: dispatcher
      DB_PASSWORD: dispatcher
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        # Wait until pg_isready succeeds, not just until the container has started.
        condition: service_healthy

volumes:
  postgres-data:
